name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/football-prediction-page-f98mts
      - master
    paths:
      - worldcup-prediction.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to gh-pages branch
        run: |
          mkdir -p /tmp/site
          cp worldcup-prediction.html /tmp/site/index.html
          cp worldcup-prediction.html /tmp/site/worldcup-prediction.html
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
